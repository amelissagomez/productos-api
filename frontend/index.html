<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Productos - Prueba Técnica</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="container">
    <h1>Gestión de Productos</h1>

    <h2>Lista de Productos</h2>

    <table border="1" width="100%">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Cantidad Disponible</th>
            <th>Descripción</th>
            <th>Categoría</th>
        </tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
    </table>

    <hr>

    <h2>Buscar Productos</h2>

    <h3>Por ID</h3>
    <div class="form-group">
        <input type="number" id="idInput" placeholder="Ingresa ID del producto" min="1" />
        <button onclick="buscarPorId()">Buscar por ID</button>
    </div>

    <h3>Por Categoría (Nombre)</h3>
    <div class="form-group">
        <select id="categoriaSelect">
            <option value="">-- Selecciona una categoría --</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Accesorios">Accesorios</option>
            <option value="Oficina">Oficina</option>
            <option value="Deportes">Deportes</option>
        </select>
        <button onclick="buscarPorCategoria()">Buscar por Categoría</button>
        <button onclick="cargarProductos()">Mostrar Todos</button>
    </div>

    <p id="mensaje"></p>

    <hr>

    <h2>Crear Nuevo Producto</h2>
    <div class="form-group">
        <input type="text" id="nombre" placeholder="Nombre del producto" />
        <input type="number" id="precio" placeholder="Precio" step="0.01" />
        <input type="number" id="cantidad" placeholder="Cantidad disponible" />
    </div>
    <div class="form-group">
        <input type="text" id="descripcion" placeholder="Descripción (opcional)" />
        <select id="categoria">
            <option value="">-- Selecciona categoría --</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Accesorios">Accesorios</option>
            <option value="Oficina">Oficina</option>
            <option value="Deportes">Deportes</option>
        </select>
    </div>
    <button onclick="crearProducto()">Crear Producto</button>

    <script src="script.js"></script>
</div>
</body>

</html>
