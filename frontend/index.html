<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Productos - Prueba Técnica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>Lista de Productos</h2>

    <table id="tablaProductos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Cantidad Disponible</th>
          <th>Categoria</th>
        </tr>
      </thead>
      <tbody id="productos"></tbody>
    </table>

    <!-- Filtro de productos -->
    <h2>Buscar productos</h2>

    <div id="filtros">
      <!-- Por Id-->
      <div>
        <h4>Buscar por Id</h4>
        <input type="number" id="idInput" placeholder="Escribe un Id" min="1" />
        <button onclick="buscarProductoId()">Buscar</button>
      </div>

      <!-- Por Categoría-->
      <div>
        <h4>Buscar por Categoría</h4>
        <select id="valueCategoria">
          <option value="">--Selecciona una categoría--</option>
          <option value="TECNOLOGIA">Tecnología</option>
          <option value="ACCESORIOS">Accesorios</option>
          <option value="OFICINA">Oficina</option>
        </select>
        <button onclick="buscarPorCategoria()">Buscar</button>
      </div>
    </div>

    <!-- Tabla para los filtros -->
    <table id="tablaProductoFiltrado" hidden>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Cantidad Disponible</th>
          <th>Categoria</th>
        </tr>
      </thead>
      <tbody id="productoFiltrado"></tbody>
    </table>

    <p id="mensaje"></p>

    <script src="script.js"></script>
  </body>
</html>
